# Small, open-weight instruction-tuned model.
# The baseline already has high Swedish response fidelity, so this
# experiment tests whether targeted interventions can improve it.
model_name: Qwen/Qwen2.5-0.5B-Instruct
revision: main
seed: 0
max_new_tokens: 100
batch_size: 8

# Layer ranges are fractions of model depth.
# The direction is estimated at the centre layer of each range.
layer_ranges:
  - [0.40, 0.60]
  - [0.50, 0.75]
  - [0.65, 0.90]

# Rank-1 weight-edit strengths.
lambdas: [0.5, 1.0]

# Activation-steering strengths.
alphas: [0.05, 0.1, 0.2, 0.4]

# Selection rule: Swedish perplexity may increase by at most 10%
# on the development set.
max_ppl_increase: 0.10

# Number of random-direction control repetitions.
n_random: 5

# Prompting baseline.
system_prompt_sv: "Svara alltid på svenska."
